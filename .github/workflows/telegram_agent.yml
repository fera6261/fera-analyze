name: Fera Telegram Agent

on:
  schedule:
    # ارسال خلاصه روزانه: ۰۹:۰۰ به وقت تهران (۰۵:۳۰ UTC)
    - cron: "30 5 * * *"
    # نشست تعاملی صبح: ۱۲:۰۰ تهران (۰۸:۳۰ UTC)
    - cron: "30 8 * * *"
    # نشست تعاملی عصر: ۱۸:۰۰ تهران (۱۴:۳۰ UTC)
    - cron: "30 14 * * *"
    # نشست تعاملی شب: ۲۲:۰۰ تهران (۱۸:۳۰ UTC)
    - cron: "30 18 * * *"
  workflow_dispatch:  # امکان اجرای دستی

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Send daily digest
        working-directory: telegram_agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python telegram_agent.py daily

  interactive-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run interactive polling session
        working-directory: telegram_agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python telegram_agent.py interact 1500
